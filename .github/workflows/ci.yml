name: Continuous integration and development deployment

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# Queue each main-branch release as one unit: migrate first, then deploy.
concurrency:
  group: development-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Lint Markdown
        run: npm run lint:md

      - name: Unit tests
        run: npx vitest run --project unit

      - name: Storybook component tests
        run: npx vitest run --project storybook

      - name: Build
        run: npm run build

  migrate-development:
    name: Migrate development database
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: development
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify migration configuration
        env:
          DEV_DATABASE_URL_SECRET_RESOURCE: ${{ vars.DEV_DATABASE_URL_SECRET_RESOURCE }}
          DEV_CLOUD_SQL_CONNECTION_NAME: ${{ vars.DEV_CLOUD_SQL_CONNECTION_NAME }}
          DEV_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.DEV_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEV_GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.DEV_GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          test -n "$DEV_DATABASE_URL_SECRET_RESOURCE"
          test -n "$DEV_CLOUD_SQL_CONNECTION_NAME"
          test -n "$DEV_GCP_WORKLOAD_IDENTITY_PROVIDER"
          test -n "$DEV_GCP_DEPLOY_SERVICE_ACCOUNT"

      - name: Install dependencies
        run: npm ci

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.DEV_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.DEV_GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Install Cloud SQL Auth Proxy
        run: |
          proxy="$RUNNER_TEMP/cloud-sql-proxy"
          curl --fail --location --silent --show-error \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.25.4/cloud-sql-proxy.linux.amd64 \
            --output "$proxy"
          printf '%s  %s\n' \
            'b780c0d2c445ffd5d2fdba0925f2722c19fcd0d2c27c538e85713732698561f2' \
            "$proxy" | sha256sum --check --status
          chmod +x "$proxy"

      - name: Apply committed Prisma migrations
        env:
          DEV_DATABASE_URL_SECRET_RESOURCE: ${{ vars.DEV_DATABASE_URL_SECRET_RESOURCE }}
          DEV_CLOUD_SQL_CONNECTION_NAME: ${{ vars.DEV_CLOUD_SQL_CONNECTION_NAME }}
        run: |
          "$RUNNER_TEMP/cloud-sql-proxy" \
            --address 127.0.0.1 \
            --port 5432 \
            "$DEV_CLOUD_SQL_CONNECTION_NAME" &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true' EXIT

          for _ in {1..30}; do
            if ! kill -0 "$proxy_pid" 2>/dev/null; then
              wait "$proxy_pid"
              exit 1
            fi
            if (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null; then
              break
            fi
            sleep 1
          done
          (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null

          DATABASE_URL="$(gcloud secrets versions access latest --secret="$DEV_DATABASE_URL_SECRET_RESOURCE")"
          # The runtime secret targets Cloud Run's /cloudsql Unix socket. The
          # GitHub runner uses its local Auth Proxy listener instead.
          DATABASE_URL="${DATABASE_URL%%\?host=*}"
          export DATABASE_URL
          test -n "$DATABASE_URL"
          npx prisma migrate deploy

  deploy-development:
    name: Deploy development
    needs: migrate-development
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: development
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Verify deployment configuration
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_OUTLOOK_CLIENT_ID: ${{ secrets.VITE_OUTLOOK_CLIENT_ID }}
          DEV_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.DEV_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEV_GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.DEV_GCP_DEPLOY_SERVICE_ACCOUNT }}
          DEV_ARTIFACT_REGISTRY_HOST: ${{ secrets.DEV_ARTIFACT_REGISTRY_HOST }}
          DEV_ARTIFACT_IMAGE_REPOSITORY: ${{ secrets.DEV_ARTIFACT_IMAGE_REPOSITORY }}
          DEV_CLOUD_RUN_SERVICE: ${{ secrets.DEV_CLOUD_RUN_SERVICE }}
          DEV_CLOUD_RUN_REGION: ${{ secrets.DEV_CLOUD_RUN_REGION }}
        run: |
          test -n "$VITE_GOOGLE_CLIENT_ID"
          test -n "$VITE_OUTLOOK_CLIENT_ID"
          test -n "$DEV_GCP_WORKLOAD_IDENTITY_PROVIDER"
          test -n "$DEV_GCP_DEPLOY_SERVICE_ACCOUNT"
          test -n "$DEV_ARTIFACT_REGISTRY_HOST"
          test -n "$DEV_ARTIFACT_IMAGE_REPOSITORY"
          test -n "$DEV_CLOUD_RUN_SERVICE"
          test -n "$DEV_CLOUD_RUN_REGION"

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.DEV_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.DEV_GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Configure Docker authentication
        env:
          DEV_ARTIFACT_REGISTRY_HOST: ${{ secrets.DEV_ARTIFACT_REGISTRY_HOST }}
        run: gcloud auth configure-docker "$DEV_ARTIFACT_REGISTRY_HOST" --quiet

      - id: image
        name: Build and push immutable image
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_OUTLOOK_CLIENT_ID: ${{ secrets.VITE_OUTLOOK_CLIENT_ID }}
          DEV_ARTIFACT_IMAGE_REPOSITORY: ${{ secrets.DEV_ARTIFACT_IMAGE_REPOSITORY }}
        run: |
          IMAGE_URI="${DEV_ARTIFACT_IMAGE_REPOSITORY}:${GITHUB_SHA}"
          docker build \
            --build-arg VITE_GOOGLE_CLIENT_ID="$VITE_GOOGLE_CLIENT_ID" \
            --build-arg VITE_OUTLOOK_CLIENT_ID="$VITE_OUTLOOK_CLIENT_ID" \
            --tag "$IMAGE_URI" \
            .
          docker push "$IMAGE_URI"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Deploy immutable image to development
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ secrets.DEV_CLOUD_RUN_SERVICE }}
          region: ${{ secrets.DEV_CLOUD_RUN_REGION }}
          image: ${{ steps.image.outputs.uri }}
